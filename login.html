<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · CourseSpec AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="login.css">
    <style>
        body {
            display: grid;
            place-items: center;
            min-height: 100vh;
            padding: 20px
        }

        .box {
            width: 100%;
            max-width: 400px;
            padding: 32px
        }

        .brand {
            justify-content: center;
            font-size: 20px;
            padding-bottom: 20px
        }

        .tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #f4f4f5;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px
        }

        .tabs button {
            border: 0;
            background: none;
            padding: 9px;
            border-radius: 9px;
            font-weight: 500;
            color: var(--mut)
        }

        .tabs button.on {
            background: #fff;
            color: var(--ink);
            box-shadow: 0 1px 2px rgba(0, 0, 0, .08)
        }

        form {
            display: grid;
            gap: 14px
        }

        .hint {
            font-size: 12px;
            color: var(--mut);
            text-align: center;
            margin-top: 16px
        }

        .msg {
            color: var(--bad);
            font-size: 13px;
            min-height: 18px
        }
    </style>
</head>

<body>
    <div class="card box">
        <div class="brand"><span class="logo">✦</span><b>CourseSpec <span class="ac">AI</span></b></div>
        <div class="tabs"><button type="button" id="tIn" class="on">Sign in</button><button type="button"
                id="tUp">Create account</button></div>
        <form id="f" novalidate>
            <label id="nameRow" hidden><span>Full name</span><input id="name" autocomplete="name" /></label>
            <label><span>Email</span><input id="email" type="email" autocomplete="email" required /></label>
            <label><span>Password</span><input id="password" type="password" autocomplete="current-password"
                    required /></label>
            <div class="msg" id="msg" role="alert"></div>
            <button class="btn p" id="go" style="padding:12px">Sign in</button>
        </form>
        <p class="hint" id="hint">Demo account: aisha@northbridge.edu / Demo@1234</p>
    </div>
    <script>
        const $ = (s) => document.querySelector(s);
        let mode = "login";
        fetch("/api/auth/me").then((r) => r.ok && (location.href = "/"));

        function setMode(m) {
            mode = m;
            $("#tIn").classList.toggle("on", m === "login"); $("#tUp").classList.toggle("on", m === "signup");
            $("#nameRow").hidden = m === "login"; $("#go").textContent = m === "login" ? "Sign in" : "Create account";
            $("#password").autocomplete = m === "login" ? "current-password" : "new-password";
            $("#hint").hidden = m === "signup"; $("#msg").textContent = "";
        }
        $("#tIn").onclick = () => setMode("login"); $("#tUp").onclick = () => setMode("signup");

        $("#f").onsubmit = async (e) => {
            e.preventDefault(); $("#msg").textContent = ""; $("#go").disabled = true;
            try {
                const res = await fetch("/api/auth/" + (mode === "login" ? "login" : "signup"), {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: $("#name").value, email: $("#email").value, password: $("#password").value }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || "Something went wrong");
                location.href = "/";
            } catch (err) { $("#msg").textContent = err.message; }
            $("#go").disabled = false;
        };
    </script>
</body>

</html>
